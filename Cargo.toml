[package]
name = "sequence"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
fjall = "2.11.2"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.14"

[[bench]]
name = "concurrent_rw"
harness = false

[[bench]]
name = "fjall_log"
harness = false
